<!-- Сравнение -->
<section class="compare" id="compare">
  <div class="wrap">
    <div class="sec-head rv">
      <div>
        <div class="kicker" style="color:var(--sky)"><svg viewBox="0 0 14 18"><path d="M2 2l9 7-9 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>Сравнение подходов</div>
        <h2 style="font-size:clamp(28px,3.4vw,42px)">Разрозненные подрядчики<br>или один технологический партнёр</h2>
      </div>
      <div class="switch cut" id="sw">
        <span class="knob cut"></span>
        <button class="on" data-mode="bad">Несколько подрядчиков</button>
        <button data-mode="good">ИНФОТЕХ</button>
      </div>
    </div>
    <div class="cmp-grid">
      <div class="cmp-visual rv">
        <svg viewBox="0 0 440 320" id="cmpSvg" aria-hidden="true"></svg>
      </div>
      <div>
        <div class="cmp-rows" id="cmpRows"></div>
        <div class="cmp-score" id="cmpScore"></div>
      </div>
    </div>
  </div>
</section>
